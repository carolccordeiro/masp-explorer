<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KORA · Museus inteligentes</title>
    <meta name="description" content="KORA é um guia inteligente para museus: scanner de obras com IA, roteiros personalizados, assistente, acessibilidade e painel de métricas. Demonstração com MASP, IMS e MAM." />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KORA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KORA · Museus inteligentes" />
    <meta property="og:description" content="Scanner de obras, roteiros, assistente de IA e acessibilidade para museus." />
    <meta property="og:image" content="/icons/og.png" />
    <script>
      // Evita "flash" de tema claro antes do React carregar
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("kora-settings-v2") || "{}");
          var dark = s.appearance === "dark" || (s.appearance !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          if (s.fontScale) document.documentElement.style.setProperty("--font-scale", s.fontScale);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>A KORA precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
