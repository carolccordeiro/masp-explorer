  <script>
    // Companion of public/404.html — converts the ?/path query the 404 page produced
    // back into a real history entry, so React Router can pick the right route on load.
    (function () {
      var l = window.location;
      if (l.search.indexOf("?/") === 0) {
        var decoded = l.search.slice(2).split("&").map(function (s, i) {
          return (i === 0 ? "" : "&") + s.replace(/~and~/g, "&");
        }).join("");
        window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })();
  </script>
